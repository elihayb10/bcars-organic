name: organic
# הפוסט האורגני היומי של בית הרכב. ראו daily.mjs
# prepare: א'–ו' ב-02:17 UTC (04:17 בחורף, 05:17 בקיץ; דקה לא עגולה כי GitHub מאחר/מדלג בשעות עגולות). המשימה של Claude מפעילה ידנית אם לא רץ. render: כשמשימת Claude דוחפת את השורה המיוחדת ל-claude/line-<תאריך>
on:
  schedule:
    - cron: '17 2 * * 0-5'
  workflow_dispatch:
  push:
    branches: ['claude/line-*']
permissions:
  contents: write
concurrency:
  group: organic
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare
        env:
          AUTO360_EMAIL: ${{ secrets.AUTO360_EMAIL }}
          AUTO360_CODE: ${{ secrets.AUTO360_CODE }}
        run: node daily.mjs prepare
  render:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          npm ci --no-audit --no-fund
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LINE_REF: ${{ github.ref_name }}
        run: |
          git fetch -q origin "$LINE_REF"
          node daily.mjs render
